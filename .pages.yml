media:
  input: assets/uploads
  output: /assets/uploads
  categories: [image]

content:
  - name: posts
    label: Posts
    type: collection
    path: _posts
    format: yaml-frontmatter
    subfolders: false
    filename:
      template: "{year}-{month}-{day}-{primary}.md"
      field: create
    view:
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Post date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: summary
        label: Short summary
        type: text
      - name: cover
        label: Cover image
        type: image
      - name: cover_alt
        label: Cover image description
        type: string
        description: Describe the image for readers using a screen reader.
      - name: body
        label: Post body
        type: rich-text
        required: true
        options:
          format: markdown
