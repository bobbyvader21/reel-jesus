media:
  input: assets/uploads
  output: /assets/uploads
  categories: [image]

content:
  - name: posts
    label: Posts
    type: collection
    path: _posts
    format: yaml-frontmatter
    subfolders: false
    filename:
      template: "{year}-{month}-{day}-{primary}.md"
      field: create
    view:
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Post date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: summary
        label: Short summary
        type: text
      - name: cover
        label: Cover image
        type: image
      - name: cover_alt
        label: Cover image description
        type: string
        description: Describe the image for readers using a screen reader.
      - name: body
        label: Introduction or existing post body
        type: rich-text
        description: Optional text shown before the sections. Use this field to edit older posts.
        options:
          format: markdown
      - name: sections
        label: Article sections
        type: object
        description: Add a section for each heading, text passage, image, or divider.
        list:
          collapsible:
            collapsed: false
            summary: "Section {index} · {heading}"
        fields:
          - name: divider
            label: Add a divider above this section
            type: boolean
          - name: heading
            label: Section heading
            type: string
          - name: text
            label: Section text
            type: rich-text
            description: Write paragraphs and add more headings or inline images here.
            options:
              format: markdown
          - name: image
            label: Section image
            type: image
          - name: image_alt
            label: Image description
            type: string
          - name: caption
            label: Image caption
            type: string
